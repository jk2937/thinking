<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thinking...</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  /* The palette of the Crash Test Dummy UI kit (crash-test-dummy-web, src/theme/colors.ts). */
  --ctd-surface: #1c1c20;
  --ctd-panel: #16161a;
  --ctd-text: #f0eee8;
  --ctd-muted: #96948e;
  --ctd-sky: #8fcdf2;
  --ctd-paper: #d9c9b0;
  --ctd-gold: #ffcc40;
  --ctd-dialog-ring: #5d5d63;
  --ctd-dialog-fill: #2c2c31;
  --ctd-control-off: #55555b;

  --margin-v: clamp(24px, 5vh, 64px);
  --margin-h: clamp(24px, 5vw, 96px);
  --gutter: clamp(16px, 2vw, 28px);
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--ctd-sky);
  font-family: 'Fredoka', system-ui, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--margin-v) var(--margin-h);
}

.comic {
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--gutter);
  width: min(100%, calc((100vh - 2 * var(--margin-v) - var(--gutter)) * 2 / 3));
  width: min(100%, calc((100dvh - 2 * var(--margin-v) - var(--gutter)) * 2 / 3));
}

/* The kit's Surface: a dark outline, a ring of its own colour, then the fill
   with its shine and a fitted dot texture (the kit's polka preset: a 6px mark
   on an 18px pitch, offset rows -- the same mark size on every panel). */
.panel {
  position: relative;
  overflow: hidden;
  container-type: size;
  aspect-ratio: 4 / 3;
  border: 6px solid var(--ctd-panel);
  border-radius: clamp(18px, 4vmin, 30px);
  box-shadow: inset 0 0 0 6px var(--ctd-dialog-ring);
  background:
    radial-gradient(circle, rgb(255 255 255 / 0.07) 3px, transparent 3.5px) 0 0 / 18px 18px,
    radial-gradient(circle, rgb(255 255 255 / 0.07) 3px, transparent 3.5px) 9px 9px / 18px 18px,
    linear-gradient(to top, rgb(255 255 255 / 0.12), rgb(255 255 255 / 0) 55%, rgb(0 0 0 / 0.1));
  background-color: var(--ctd-dialog-fill);
}

/* The scene sits inside the ring, as content does on the kit's surfaces. */
.scene {
  position: absolute;
  inset: 12px;
}

/* desk */
.desk {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 16cqh;
  background: var(--ctd-paper);
}
.desk::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2.4cqh;
  background: rgb(22 22 26 / 0.12);
}

/* monitor */
.monitor {
  position: absolute;
  left: 50%; bottom: 21cqh;
  transform: translateX(-50%);
  width: 66cqw;
  height: 52cqh;
  background: var(--ctd-panel);
  border-radius: 2cqh;
}
.monitor::before {
  content: "";
  position: absolute;
  top: 0.8cqh; left: 50%;
  transform: translateX(-50%);
  width: 1cqh; height: 1cqh;
  border-radius: 50%;
  background: var(--ctd-control-off);
}
.screen {
  position: absolute;
  left: 2.2cqw; right: 2.2cqw;
  top: 2.6cqh; bottom: 3.2cqh;
  background: var(--ctd-surface);
  border-radius: 1.2cqh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 1cqw;
  text-align: center;
}

/* stand + base */
.base {
  position: absolute;
  left: 50%; bottom: 15cqh;
  transform: translateX(-50%);
  width: 15cqw; height: 1.8cqh;
  background: var(--ctd-panel);
  border-radius: 1cqh;
}
.base::before {
  content: "";
  position: absolute;
  bottom: 100%;
  left: 50%;
  transform: translateX(-50%);
  width: 5cqw; height: 6cqh;
  background: var(--ctd-panel);
}

/* desk accessories */
.keyboard {
  position: absolute;
  left: 32cqw; bottom: 4.5cqh;
  width: 27cqw; height: 5cqh;
  background: var(--ctd-panel);
  border-radius: 1cqh;
}
.mouse {
  position: absolute;
  left: 62.5cqw; bottom: 4cqh;
  width: 5cqw; height: 6.5cqh;
  background: var(--ctd-panel);
  border-radius: 2.5cqw 2.5cqw 1.2cqw 1.2cqw;
}
.mug {
  position: absolute;
  left: 6cqw; bottom: 16cqh;
  width: 7.5cqw; height: 11cqh;
  background: var(--ctd-gold);
  border-radius: 0.8cqw 0.8cqw 0.4cqw 0.4cqw;
}
.mug::after {
  content: "";
  position: absolute;
  right: -3.2cqw; top: 50%;
  transform: translateY(-50%);
  width: 3cqw; height: 5cqh;
  border: 1.1cqw solid var(--ctd-gold);
  border-left: none;
  border-radius: 0 2cqw 2cqw 0;
}

/* on-screen text */
.screen p {
  color: var(--ctd-text);
  font-size: max(13px, 2.8cqw);
  font-weight: 500;
  line-height: 1.55;
}
.screen p.idle {
  color: var(--ctd-muted);
  font-size: max(15px, 4.2cqw);
  letter-spacing: 0.02em;
}
</style>
</head>
<body>
  <main class="comic" aria-label="Two-panel comic: Thinking...">
    <section class="panel">
      <div class="scene">
        <div class="desk"></div>
        <div class="mug"></div>
        <div class="keyboard"></div>
        <div class="mouse"></div>
        <div class="base"></div>
        <div class="monitor">
          <div class="screen"><p class="idle">Thinking...</p></div>
        </div>
      </div>
    </section>
    <section class="panel">
      <div class="scene">
        <div class="desk"></div>
        <div class="mug"></div>
        <div class="keyboard"></div>
        <div class="mouse"></div>
        <div class="base"></div>
        <div class="monitor">
          <div class="screen"><p>They keep saying &lsquo;just.&rsquo;<br>The task is enormous.</p></div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
